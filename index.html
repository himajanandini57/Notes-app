<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>My Notes</h1>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="form-title">New note</h2>
      <form id="note-form">
        <input id="note-title" type="text" placeholder="Title" maxlength="80" required />
        <textarea id="note-body" placeholder="Write your note..." rows="4" required></textarea>
        <div class="form-actions">
          <button type="submit" id="save-btn">Add note</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search notes..." />
        <button id="export-btn" type="button" class="secondary">Export</button>
      </div>
      <p id="count" class="muted"></p>
      <div id="notes" class="notes"></div>
      <p id="empty" class="muted hidden">No notes found.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
